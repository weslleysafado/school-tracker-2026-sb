<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Tracker 2026 - Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon_avelino.ico" type="image/x-icon">
   
    <!-- CLIENTE SDK SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script&gt;

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background-color: var(--bg-color);
        }
        .menu-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
        }
       
        /* Estilização da Logo */
        .logo-colegio {
            max-width: 150px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        h1 { margin-bottom: 30px; color: white; font-size: 2rem; }
       
        /* --- ESTILOS DO FORMULÁRIO DE LOGIN --- */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-group label {
            color: var(--text-main);
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .input-group input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .input-group input:focus {
            border-color: #3b82f6;
        }
        .btn-submit {
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #059669;
        }
        .error-message {
            color: #ef4444;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 5px;
            display: none;
        }

        /* --- MENU PRINCIPAL (INICIALMENTE ESCONDIDO) --- */
        .btn-group {
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        .btn {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
            border-radius: 10px;
            transition: transform 0.2s, background 0.2s;
        }
        .btn-scanner { background: #3b82f6; }
        .btn-telao { background: #8b5cf6; }
        .btn:hover { transform: scale(1.05); filter: brightness(1.1); }
       
        p { margin-top: 25px; font-size: 0.9rem; opacity: 0.7; color: var(--text-main); }
    </style>
</head>
<body>

    <div class="menu-container">
        <img src="logo.png" alt="Logo do Colégio" class="logo-colegio">
       
        <h1>School Tracker</h1>
       
        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label for="usuario">E-mail de Acesso</label>
                <input type="email" id="usuario" required placeholder="Ex: professor@escola.com">
            </div>
            <div class="input-group">
                <label for="senha">Chave de Segurança</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Autenticar Portal</button>
            <div id="mensagemErro" class="error-message">Acesso negado. Credenciais incorretas!</div>
        </form>
       
        <div id="menuBotoes" class="btn-group">
            <a href="scanner.html" class="btn btn-scanner">📸 Abrir Scanner (Entrada/Saída)</a>
            <a href="telao.html" class="btn btn-telao">🖥️ Abrir Dashboard (Telão)</a>
        </div>
       
        <p>Colégio Avelino Antonio Vieira - 2026 - <span class="neon-blue">Client Mode</span></p>
    </div>

    <script>
        /* =========================================================
           INICIALIZAÇÃO DO SUPABASE
           ========================================================= */
        const SUPABASE_URL = 'https://jrdzgddszylausmwgrxw.supabase.co&#39;;
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpyZHpnZGRzenlsYXVzbXdncnh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NzAwNDgsImV4cCI6MjEwNzE0NjA0OH0.6a9pbuSuabu9yP5zdtlemeIQYTXIB4ArauayEi5N-BY';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: false }
        });

        // Limpa canais órfãos ao carregar o portal de login
        if (supabaseClient) {
            supabaseClient.removeAllChannels();
        }

        const form = document.getElementById('loginForm');
        const botoes = document.getElementById('menuBotoes');
        const erro = document.getElementById('mensagemErro');

        // Se já estiver logado na sessão, exibe o menu diretamente
        if (sessionStorage.getItem('logado') === 'true') {
            form.style.display = "none";
            botoes.style.display = "flex";
        }

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const email = document.getElementById('usuario').value.trim();
            const password = document.getElementById('senha').value.trim();

            erro.style.display = "none";

            try {
                // Autenticação via Supabase Auth
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    throw error;
                }

                if (data.user) {
                    sessionStorage.setItem('logado', 'true');
                    form.style.display = "none";
                    botoes.style.display = "flex";
                }
            } catch (err) {
                console.error("Erro na autenticação Supabase:", err.message);
                erro.innerText = "Acesso negado. Credenciais incorretas!";
                erro.style.display = "block";
                document.getElementById('senha').value = "";
            }
        });
    </script>
</body>
</html>
